<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f5ef">
<title>Question bank · NTF Anaesthesia</title>
<meta name="description" content="Practise the NTF anaesthesia department's multiple-choice questions on your phone.">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Questions">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="../fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ui/app.css">
</head>
<body>
<div class="app">
  <header class="bar" id="bar">
    <div class="bar-inner">
      <div class="bar-start" id="bar-start"></div>
      <div class="bar-mid" id="bar-mid"></div>
      <div class="bar-end"><span class="badge offline" id="offline" hidden>Offline</span><span id="bar-end" class="bar-end"></span></div>
    </div>
    <div id="bar-extra"></div>
  </header>
  <main id="main" tabindex="-1">
    <div class="sk sk-title"></div>
    <div class="sk-row"><div class="sk" style="width:70%"></div></div>
    <div class="sk-row"><div class="sk" style="width:55%"></div></div>
    <div class="sk-row"><div class="sk" style="width:62%"></div></div>
  </main>
  <div id="foot"></div>
  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <a class="tab" href="#/practise" data-tab="practise"><span data-icon="practise"></span>Practise</a>
    <a class="tab" href="#/browse" data-tab="browse"><span data-icon="browse"></span>Browse</a>
    <a class="tab" href="#/papers" data-tab="papers"><span data-icon="papers"></span>Papers</a>
    <a class="tab" href="#/progress" data-tab="progress"><span data-icon="progress"></span>Progress</a>
  </nav>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="sr-only" id="live" aria-live="polite"></div>
<noscript><p style="padding:16px">This app needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>

# Tests for the BIS to DSA simulator (eeg/), on every PR that changes them.
# Each browser suite runs as its own job, side by side; "browser" is green only when all of them passed.
name: Checks
on:
  pull_request:
    paths: ['eeg/**', 'tools/vendor/**', '.github/workflows/checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: BIS engine tuning
        run: node eeg/test/engine.check.mjs

  browser-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Processed EEG (phone), cmd: "BIS_VIEW=phone node eeg/test/demo.e2e.mjs" }
          - { name: Processed EEG (desktop), cmd: "BIS_VIEW=desktop node eeg/test/demo.e2e.mjs" }
          - { name: EEG monitor sizing, cmd: "node eeg/test/layout.e2e.mjs" }
          - { name: EEG teaching, cmd: "node eeg/test/teaching.e2e.mjs" }
          - { name: EEG controls, cmd: "node eeg/test/controls.e2e.mjs" }
    name: browser (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: |
          npm install -g playwright@1.56.1
          playwright install chromium
      - name: Test
        run: |
          export PLAYWRIGHT_PATH="$(npm root -g)/playwright/index.mjs"
          (python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 1
          ${{ matrix.cmd }}

  browser:
    needs: browser-suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.browser-suite.result }}
    steps:
      - run: |
          echo "browser suites $RESULT"
          [ "$RESULT" = success ]

# TCI emulator (apps/tci -> tci/): engine tests against the Python oracle, golden file in sync with the oracle,
# committed build up to date, a 390 px browser check in light and dark, and the pump emulator's full-flow check.
name: TCI emulator
on:
  pull_request:
    paths: ['apps/tci/**', 'tci/**', 'assets/app/**', '.github/workflows/tci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/tci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: Golden file matches the oracle
        run: |
          python3 oracle/tci_ref.py --golden /tmp/golden.json
          python3 oracle/compare_golden.py /tmp/golden.json test/golden.json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/tci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tci/package-lock.json
      - run: npm ci
      - name: References panel matches docs/REFERENCES.md
        run: |
          npm run -s refs
          git diff --exit-code -- src/refs.generated.json
      - name: Unit tests
        run: npm test
      - name: Committed build is current
        run: |
          npm run build
          git status --porcelain -- ../../tci
          test -z "$(git status --porcelain -- ../../tci)"
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('apps/tci/package-lock.json') }}
      - name: Browser check (390 px, light and dark)
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
          (cd ../.. && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 1
          npm run e2e
      - name: Pump emulator browser check (390 and 1280 px, light and dark, full flow)
        run: npm run e2e:pump
